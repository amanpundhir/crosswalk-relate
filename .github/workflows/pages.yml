# Publishes the static browser explorer (web/) to GitHub Pages.
# Repo setting needed once: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy explorer to Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site (skip dev-only files)
        run: |
          mkdir -p _site
          cp -r web/. _site/
          rm -rf _site/node_modules _site/check.mjs _site/package*.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      # one artifact name per attempt, so "Re-run" never finds two artifacts with the same name
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
